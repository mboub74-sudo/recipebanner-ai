<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecipeBanner AI — 4 Pins from a Link</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1b3040;font:16px system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:35px 20px}h1{margin:0;font-size:34px}h1 span{color:#0c8b75}p{color:#64748b}.form{background:#fff;padding:24px;border-radius:16px;box-shadow:0 6px 30px #14283a0c;margin:26px 0;display:flex;gap:12px}input{min-width:0;flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:15px;font:inherit}button{background:#087e6e;color:white;border:0;border-radius:10px;padding:15px 22px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{min-height:24px;color:#aa4d24}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.item{background:white;padding:10px;border-radius:12px;box-shadow:0 4px 15px #14283a0c}.item canvas{display:block;width:100%;height:auto;border-radius:7px}.item button{width:100%;margin-top:10px;padding:11px;font-size:13px}.hide{display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.form{flex-direction:column}.grid{grid-template-columns:1fr 1fr}h1{font-size:27px}}</style><main class="wrap"><h1>RecipeBanner <span>AI</span></h1><p>Paste a recipe article link. Generate four Pinterest Pins: two single-photo and two double-photo with text in the middle.</p><form id="form" class="form"><input id="url" type="url" placeholder="https://www.mealrivo.com/your-recipe/" required aria-label="Recipe article URL"><button id="generate">✦ Generate 4 Pins</button></form><p id="status" class="status" role="status"></p><section id="results" class="hide"><h2>Your 4 Pins</h2><div id="grid" class="grid"></div></section></main><script>
const $=x=>document.getElementById(x);const styles=[{bg:'#fff6e9',ink:'#2d4039',accent:'#c87745'},{bg:'#123e39',ink:'#ffffff',accent:'#f3bd77'},{bg:'#f7f4ef',ink:'#253344',accent:'#d66f5b'},{bg:'#2e304b',ink:'#ffffff',accent:'#e6ba83'}];let canvases=[];function wrap(ctx,text,maxWidth,maxLines){const words=text.split(/\s+/);const out=[];let line='';for(const word of words){const next=line?line+' '+word:word;if(ctx.measureText(next).width>maxWidth&&line){out.push(line);line=word}else line=next}if(line)out.push(line);return out.slice(0,maxLines).map((s,i)=>i===maxLines-1&&out.length>maxLines?s+'…':s)}
function cover(ctx,img,x,y,w,h){const scale=Math.max(w/img.width,h/img.height);const iw=img.width*scale,ih=img.height*scale;ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}
function drawDouble(canvas,i,data,top,bottom){canvas.width=1000;canvas.height=1500;const ctx=canvas.getContext('2d'),s=styles[i];ctx.fillStyle=s.bg;ctx.fillRect(0,0,1000,1500);cover(ctx,top,0,0,1000,555);cover(ctx,bottom,0,940,1000,560);ctx.fillStyle=s.bg;ctx.fillRect(0,555,1000,385);ctx.fillStyle=s.accent;ctx.fillRect(0,555,1000,10);ctx.fillRect(0,930,1000,10);ctx.textAlign='center';ctx.fillStyle=s.accent;ctx.font='bold 29px system-ui';ctx.fillText(i?'SAVE THIS RECIPE':'EASY & DELICIOUS',500,640);ctx.fillStyle=s.ink;ctx.font='bold 68px Georgia,serif';const lines=wrap(ctx,data.title,875,3);let y=720;for(const line of lines){ctx.fillText(line,500,y);y+=78}ctx.font='bold 26px system-ui';ctx.fillStyle=s.accent;ctx.fillText(data.brand,500,904)}
function drawSingle(canvas,i,data,img){canvas.width=1000;canvas.height=1500;const ctx=canvas.getContext('2d'),s=styles[i];ctx.fillStyle=s.bg;ctx.fillRect(0,0,1000,1500);cover(ctx,img,0,0,1000,1020);ctx.fillStyle=s.bg;ctx.fillRect(0,980,1000,520);ctx.fillStyle=s.accent;ctx.fillRect(0,980,1000,9);ctx.textAlign='center';ctx.font='bold 27px system-ui';ctx.fillText(i===0?'EASY RECIPE':'SAVE FOR LATER',500,1055);ctx.fillStyle=s.ink;ctx.font='bold 70px Georgia,serif';let y=1150;for(const line of wrap(ctx,data.title,860,3)){ctx.fillText(line,500,y);y+=82}ctx.fillStyle=s.accent;ctx.font='bold 27px system-ui';ctx.fillText(data.brand,500,1450)}
function getImage(url){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Could not load recipe image'));im.src=url})}
$('form').onsubmit=async e=>{e.preventDefault();const btn=$('generate'),status=$('status');btn.disabled=true;btn.textContent='Generating…';$('results').classList.add('hide');$('grid').replaceChildren();try{const link=new URL($('url').value);if(!['https:','http:'].includes(link.protocol))throw Error('Use an HTTP(S) article link.');status.textContent='Reading recipe article…';const response=await fetch('/api/recipe?url='+encodeURIComponent(link.href));const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to read article');if(!data.image)throw Error('No recipe image found.');const urls=[...new Set(data.images||[data.image])];status.textContent='Loading photos from article…';const loaded=[];for(const url of urls){if(loaded.length>=12)break;try{const im=await getImage('/api/image?url='+encodeURIComponent(url));if(im.width>=350&&im.height>=250)loaded.push(im)}catch{}}if(loaded.length<2)throw Error('This article needs at least 2 accessible photos to generate two-photo Pins.');status.textContent='Creating four Pins…';canvases=[];for(let i=0;i<4;i++){const card=document.createElement('div');card.className='item';const canvas=document.createElement('canvas');if(i<2)drawSingle(canvas,i,data,loaded[i%loaded.length]);else drawDouble(canvas,i,data,loaded[(i*2-2)%loaded.length],loaded[(i*2-1)%loaded.length]);canvases.push(canvas);const b=document.createElement('button');b.textContent='↓ Download Pin '+(i+1);b.onclick=()=>{const a=document.createElement('a');a.download='recipe-pin-'+(i+1)+'.png';a.href=canvas.toDataURL('image/png');a.click()};card.append(canvas,b);$('grid').append(card)}$('results').classList.remove('hide');status.textContent='✓ Four Pins ready. Download each PNG below.'}catch(err){status.textContent='⚠ '+err.message}finally{btn.disabled=false;btn.textContent='✦ Generate 4 Pins'}};
</script></html>
