<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecipeBanner AI — 4 Pins from a Link</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1b3040;font:16px system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:35px 20px}h1{margin:0;font-size:34px}h1 span{color:#0c8b75}p{color:#64748b}.form{background:#fff;padding:24px;border-radius:16px;box-shadow:0 6px 30px #14283a0c;margin:26px 0;display:flex;gap:12px}input{min-width:0;flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:15px;font:inherit}button{background:#087e6e;color:white;border:0;border-radius:10px;padding:15px 22px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{min-height:24px;color:#aa4d24}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.item{background:white;padding:10px;border-radius:12px;box-shadow:0 4px 15px #14283a0c}.item canvas{display:block;width:100%;height:auto;border-radius:7px}.item button{width:100%;margin-top:10px;padding:11px;font-size:13px}.hide{display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.form{flex-direction:column}.grid{grid-template-columns:1fr 1fr}h1{font-size:27px}}</style><main class="wrap"><h1>RecipeBanner <span>AI</span></h1><p>Paste a recipe article link. Generate four Pinterest-ready Pins.</p><form id="form" class="form"><input id="url" type="url" placeholder="https://www.mealrivo.com/your-recipe/" required aria-label="Recipe article URL"><button id="generate">✦ Generate 4 Pins</button></form><p id="status" class="status" role="status"></p><section id="results" class="hide"><h2>Your 4 Pins</h2><div id="grid" class="grid"></div></section></main><script>
const $=x=>document.getElementById(x);const styles=[{bg:'#fff6e9',ink:'#2d4039',accent:'#c87745'},{bg:'#123e39',ink:'#ffffff',accent:'#f3bd77'},{bg:'#f7f4ef',ink:'#253344',accent:'#d66f5b'},{bg:'#2e304b',ink:'#ffffff',accent:'#e6ba83'}];let canvases=[];function wrap(ctx,text,maxWidth,maxLines){const words=text.split(/\s+/);const out=[];let line='';for(const word of words){const next=line?line+' '+word:word;if(ctx.measureText(next).width>maxWidth&&line){out.push(line);line=word}else line=next}if(line)out.push(line);return out.slice(0,maxLines).map((s,i)=>i===maxLines-1&&out.length>maxLines?s+'…':s)}
function draw(canvas,i,data,img){canvas.width=1000;canvas.height=1500;const ctx=canvas.getContext('2d'),s=styles[i];ctx.fillStyle=s.bg;ctx.fillRect(0,0,1000,1500);const photoHeight=i===2?880:940;const ratio=Math.max(1000/img.width,photoHeight/img.height);ctx.drawImage(img,(1000-img.width*ratio)/2,(photoHeight-img.height*ratio)/2,img.width*ratio,img.height*ratio);ctx.fillStyle=s.bg;if(i===2)ctx.fillRect(40,810,920,690);else ctx.fillRect(0,photoHeight-45,1000,1500-photoHeight+45);ctx.fillStyle=s.accent;ctx.font='bold 31px system-ui';ctx.fillText(['EASY & DELICIOUS','RECIPE TO SAVE','DINNER INSPIRATION','MAKE IT TODAY'][i],78,1005);ctx.fillStyle=s.ink;ctx.font='bold 76px Georgia,serif';let y=1110;for(const line of wrap(ctx,data.title,850,3)){ctx.fillText(line,78,y);y+=90}ctx.fillStyle=s.accent;ctx.fillRect(78,1390,140,8);ctx.fillStyle=s.ink;ctx.font='bold 30px system-ui';ctx.fillText(data.brand,78,1450)}
function getImage(url){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Could not load recipe image'));im.src=url})}
$('form').onsubmit=async e=>{e.preventDefault();const btn=$('generate'),status=$('status');btn.disabled=true;btn.textContent='Generating…';$('results').classList.add('hide');$('grid').replaceChildren();try{const link=new URL($('url').value);if(!['https:','http:'].includes(link.protocol))throw Error('Use an HTTP(S) article link.');status.textContent='Reading recipe article…';const response=await fetch('/api/recipe?url='+encodeURIComponent(link.href));const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to read article');if(!data.image)throw Error('This article has no accessible recipe image.');status.textContent='Creating four images…';const img=await getImage('/api/image?url='+encodeURIComponent(data.image));canvases=[];for(let i=0;i<4;i++){const card=document.createElement('div');card.className='item';const canvas=document.createElement('canvas');draw(canvas,i,data,img);canvases.push(canvas);const b=document.createElement('button');b.textContent='↓ Download Pin '+(i+1);b.onclick=()=>{const a=document.createElement('a');a.download='recipe-pin-'+(i+1)+'.png';a.href=canvas.toDataURL('image/png');a.click()};card.append(canvas,b);$('grid').append(card)}$('results').classList.remove('hide');status.textContent='✓ Four Pins ready. Download each PNG below.'}catch(err){status.textContent='⚠ '+err.message}finally{btn.disabled=false;btn.textContent='✦ Generate 4 Pins'}};
</script></html>
